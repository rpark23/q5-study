<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hematology Quiz App</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --correct: #34d399;
    --correct-bg: rgba(52,211,153,0.12);
    --wrong: #f87171;
    --wrong-bg: rgba(248,113,113,0.12);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251,191,36,0.12);
    --reveal: #60a5fa;
    --reveal-bg: rgba(96,165,250,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    overflow-y: auto;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; height: 100vh;
  }
  .sidebar h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: var(--accent); }
  .sidebar .tagline { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
  .quiz-btn {
    display: block; width: 100%; text-align: left;
    padding: 8px 14px; margin-bottom: 2px;
    background: transparent; border: 1px solid transparent;
    border-radius: 8px; color: var(--text); font-size: 13px;
    cursor: pointer; transition: all 0.15s; line-height: 1.4;
  }
  .quiz-btn:hover { background: var(--surface2); }
  .quiz-btn.active { background: var(--surface2); border-color: var(--accent); }
  .quiz-btn .q-count { display: inline-block; font-size: 11px; color: var(--text-dim); margin-left: 6px; }

  .lecture-header {
    font-size: 11px; font-weight: 700; color: var(--text-dim);
    padding: 12px 14px 4px; margin-top: 4px; letter-spacing: 0.3px; line-height: 1.4;
  }
  .lecture-divider { border-top: 1px solid var(--border); margin-top: 8px; }
  .badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.5px; vertical-align: middle; margin-right: 4px;
  }
  .badge-pre { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge-post { background: rgba(52,211,153,0.15); color: var(--correct); }

  .main { margin-left: 300px; flex: 1; padding: 32px 40px; max-width: 860px; }
  .quiz-header { margin-bottom: 28px; }
  .quiz-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .quiz-header .meta { font-size: 13px; color: var(--text-dim); }
  .quiz-type-badge {
    display: inline-block; padding: 3px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .quiz-type-badge.pre-badge { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .quiz-type-badge.post-badge { background: rgba(52,211,153,0.15); color: var(--correct); }

  .progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }

  .score-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; font-size: 14px; color: var(--text-dim);
  }
  .score-bar .score { font-weight: 600; color: var(--text); }

  .question-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px 28px; margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong { border-color: var(--wrong); }
  .question-card.answered-reveal { border-color: var(--reveal); }
  .q-number { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .q-text { font-size: 15px; line-height: 1.6; margin-bottom: 16px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; line-height: 1.5;
    cursor: pointer; transition: all 0.15s; text-align: left;
  }
  .option-btn:hover:not(.disabled) { border-color: var(--accent); background: var(--surface2); }
  .option-btn .letter {
    flex-shrink: 0; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 600; font-size: 13px;
    background: var(--surface2); transition: all 0.15s;
  }
  .option-btn.selected .letter { background: var(--accent); color: var(--bg); }
  .option-btn.correct { border-color: var(--correct); background: var(--correct-bg); opacity: 1 !important; }
  .option-btn.correct .letter { background: var(--correct); color: var(--bg); }
  .option-btn.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option-btn.wrong .letter { background: var(--wrong); color: var(--bg); }
  .option-btn.disabled { cursor: default; opacity: 0.6; }
  .option-btn.disabled.correct { opacity: 1; }

  /* Per-option explanations */
  .opt-explanation {
    margin-top: 6px; padding: 8px 12px; border-radius: 6px;
    font-size: 12px; line-height: 1.5; display: none;
  }
  .opt-explanation.show { display: block; }
  .opt-explanation.opt-correct {
    background: var(--correct-bg); color: var(--correct); border: 1px solid rgba(52,211,153,0.25);
  }
  .opt-explanation.opt-wrong {
    background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
  }

  /* Reveal button */
  .reveal-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 16px; margin-top: 10px;
    background: transparent; border: 1px dashed var(--border);
    border-radius: 8px; color: var(--text-dim); font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  .reveal-btn:hover { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-bg); }
  .reveal-btn.hidden { display: none; }
  .reveal-btn .icon { font-size: 16px; }

  /* General explanation fallback */
  .explanation {
    margin-top: 12px; padding: 14px 16px; border-radius: 8px;
    font-size: 13px; line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct-exp { background: var(--correct-bg); border: 1px solid var(--correct); color: var(--correct); }
  .explanation.wrong-exp { background: var(--wrong-bg); border: 1px solid var(--wrong); color: var(--wrong); }
  .explanation.reveal-exp { background: var(--reveal-bg); border: 1px solid var(--reveal); color: var(--reveal); }
  .explanation .exp-label { font-weight: 700; margin-bottom: 4px; }

  .results {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; text-align: center; margin-top: 20px;
  }
  .results h3 { font-size: 28px; margin-bottom: 8px; }
  .results .pct { font-size: 48px; font-weight: 800; margin: 12px 0; }
  .results .pct.great { color: var(--correct); }
  .results .pct.ok { color: var(--yellow); }
  .results .pct.needs-work { color: var(--wrong); }
  .results .detail { color: var(--text-dim); font-size: 14px; margin-bottom: 4px; }
  .results .detail-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }

  .btn {
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    font-weight: 600; border: none; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .action-row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }

  .welcome { text-align: center; padding: 80px 20px; }
  .welcome h2 { font-size: 28px; margin-bottom: 12px; }
  .welcome p { color: var(--text-dim); font-size: 16px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 100; transform: translateX(-100%); transition: transform 0.25s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; padding: 20px; }
    .menu-toggle {
      display: block !important; position: fixed; top: 16px; left: 16px; z-index: 99;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; color: var(--text); font-size: 18px; cursor: pointer;
    }
  }
  .menu-toggle { display: none; }
</style>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <h1>Heme Quiz</h1>
    <div class="tagline">INDE-223B Hematology</div>
    <div id="quiz-list"></div>
  </nav>
  <main class="main" id="main">
    <div class="welcome">
      <h2>Select a Quiz</h2>
      <p>Choose a lecture from the sidebar. Each lecture has a Pre-Quiz to test baseline knowledge and a Post-Quiz with clinical scenarios to test deeper understanding.</p>
    </div>
  </main>
</div>

<script>
const QUIZZES = [
  {
    "title": "Hematopoiesis Part I \u2014 Pre-Quiz",
    "subtitle": "1 | Jan 8 | Jason Kurzer",
    "filename": "01-hematopoiesis-i-pre.md",
    "questions": [
      {
        "number": 1,
        "question": "What is the primary function of erythrocytes (red blood cells)?",
        "options": {
          "A": "Phagocytosis of bacterial pathogens",
          "B": "Transport of oxygen from lungs to tissues and carbon dioxide from tissues to lungs",
          "C": "Production of antibodies for adaptive immunity",
          "D": "Formation of the initial platelet plug at sites of vascular injury"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "Phagocytosis of bacterial pathogens is primarily performed by neutrophils and macrophages, not erythrocytes. Red blood cells lack the organelles and surface receptors necessary for phagocytic activity."
          },
          "B": {
            "status": "Correct",
            "text": "Erythrocytes are predominantly composed of hemoglobin, which binds oxygen in the lungs and delivers it to peripheral tissues. They also transport carbon dioxide back to the lungs for exhalation. This gas exchange function is the defining role of red blood cells."
          },
          "C": {
            "status": "Incorrect",
            "text": "Antibody production is the function of plasma cells, which are terminally differentiated B-lymphocytes. Erythrocytes do not participate in adaptive immunity."
          },
          "D": {
            "status": "Incorrect",
            "text": "Formation of the platelet plug (primary hemostasis) is the function of platelets (thrombocytes), not erythrocytes. Platelets are small anuclear cell fragments derived from megakaryocytes."
          }
        }
      },
      {
        "number": 2,
        "question": "What is the approximate lifespan of a mature erythrocyte in the circulation?",
        "options": {
          "A": "7-10 days",
          "B": "6-10 hours",
          "C": "120 days",
          "D": "1-5 days"
        },
        "correct": "C",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "A lifespan of 7-10 days describes platelets (thrombocytes), not erythrocytes. Platelets are much shorter-lived than red blood cells."
          },
          "B": {
            "status": "Incorrect",
            "text": "A time frame of 6-10 hours describes the approximate time neutrophils spend in the peripheral blood circulation. Erythrocytes circulate for a much longer period."
          },
          "C": {
            "status": "Correct",
            "text": "Mature erythrocytes have a lifespan of approximately 120 days in the circulation. After this period, aged red blood cells are removed primarily by splenic macrophages. This lifespan is important for calculating red cell production rates and understanding anemia dynamics."
          },
          "D": {
            "status": "Incorrect",
            "text": "A lifespan of 1-5 days describes the approximate time neutrophils spend in tissues after migrating out of the bloodstream. Erythrocytes remain in circulation for 120 days."
          }
        }
      },
      {
        "number": 3,
        "question": "Which of the following best describes hematopoiesis?",
        "options": {
          "A": "The process by which mature blood cells undergo apoptosis at the end of their lifespan",
          "B": "The generation of blood cells from precursor cells via growth factors and a specialized microenvironment",
          "C": "The filtration of aged erythrocytes by the spleen",
          "D": "The clotting cascade triggered by endothelial damage"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "Apoptosis of mature blood cells at the end of their lifespan is part of normal cell turnover, but this describes cell death and removal, not the generation of new blood cells. Hematopoiesis specifically refers to blood cell production."
          },
          "B": {
            "status": "Correct",
            "text": "Hematopoiesis is defined as the generation of blood cells from precursor cells through the coordinated action of growth factors and a specialized bone marrow microenvironment. It encompasses the entire process from hematopoietic stem cells to mature circulating blood cells."
          },
          "C": {
            "status": "Incorrect",
            "text": "Filtration of aged erythrocytes is a function of the spleen (specifically the red pulp). While this process is related to blood cell homeostasis, it describes cell removal rather than cell production."
          },
          "D": {
            "status": "Incorrect",
            "text": "The clotting cascade is the process of secondary hemostasis involving coagulation factors. It is a function of plasma proteins and platelets, not a process of blood cell generation."
          }
        }
      },
      {
        "number": 4,
        "question": "What is the key distinguishing feature of hematopoietic stem cells (HSCs) compared to progenitor cells?",
        "options": {
          "A": "HSCs are committed to a single lineage while progenitor cells are multipotent",
          "B": "HSCs have self-renewal capability while progenitor cells lack this ability",
          "C": "HSCs reside exclusively in the thymus while progenitor cells reside in bone marrow",
          "D": "HSCs are the largest compartment in the hematopoietic hierarchy"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "This reverses the relationship. HSCs are multipotent with the ability to generate all blood cell lineages, while progenitor cells are progressively committed to specific lineages as they differentiate."
          },
          "B": {
            "status": "Correct",
            "text": "The defining feature of hematopoietic stem cells is their capacity for self-renewal, meaning they can divide to produce identical copies of themselves while also generating differentiated progeny. Progenitor cells, although they can proliferate and differentiate, lack this self-renewal capability."
          },
          "C": {
            "status": "Incorrect",
            "text": "HSCs reside primarily in the bone marrow, not the thymus. The thymus is the site of T-cell maturation, and while it receives precursor T-cells from the marrow, it does not house HSCs."
          },
          "D": {
            "status": "Incorrect",
            "text": "HSCs are actually the smallest hematopoietic compartment, comprising approximately 20,000 cells. They are mostly quiescent, and the larger compartments consist of progenitor and maturing precursor cells."
          }
        }
      },
      {
        "number": 5,
        "question": "What is the primary anatomic site of hematopoiesis in a healthy adult?",
        "options": {
          "A": "Fetal liver",
          "B": "Yolk sac",
          "C": "Bone marrow",
          "D": "Spleen"
        },
        "correct": "C",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "The fetal liver is the chief site of hematopoiesis during fetal development (from about 5 weeks through birth), but it is not the primary site in a healthy adult. After birth, the bone marrow takes over this role."
          },
          "B": {
            "status": "Incorrect",
            "text": "The yolk sac is the site of primitive hematopoiesis very early in embryonic development (approximately 18 days post-fertilization). It has no role in adult hematopoiesis."
          },
          "C": {
            "status": "Correct",
            "text": "In healthy adults, the bone marrow is the exclusive site of hematopoiesis under normal conditions. With age, active hematopoiesis shifts predominantly to the axial skeleton (vertebrae, sternum, ribs, skull, pelvis)."
          },
          "D": {
            "status": "Incorrect",
            "text": "The spleen is not a primary site of hematopoiesis in healthy adults. However, in stress conditions, extramedullary hematopoiesis can occur in the spleen and liver as a compensatory mechanism."
          }
        }
      },
      {
        "number": 6,
        "question": "Which growth factor is the primary regulator of erythrocyte production?",
        "options": {
          "A": "Thrombopoietin (TPO)",
          "B": "Granulocyte colony-stimulating factor (G-CSF)",
          "C": "Interleukin-5 (IL-5)",
          "D": "Erythropoietin (EPO)"
        },
        "correct": "D",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "Thrombopoietin (TPO) is the primary growth factor for megakaryopoiesis and platelet production, not erythropoiesis. TPO acts through the MPL receptor on megakaryocyte progenitors."
          },
          "B": {
            "status": "Incorrect",
            "text": "G-CSF is the primary growth factor for granulopoiesis, specifically promoting neutrophil production and mobilization. It is used clinically to treat neutropenia, not anemia."
          },
          "C": {
            "status": "Incorrect",
            "text": "IL-5 is the specific differentiation factor for eosinophils. It does not play a significant role in erythrocyte production."
          },
          "D": {
            "status": "Correct",
            "text": "Erythropoietin (EPO) is the essential growth factor for erythrocyte production. It is produced primarily by the renal cortex in response to low oxygen tension and acts on erythroid progenitors via the EPO receptor and JAK2 signaling pathway."
          }
        }
      },
      {
        "number": 7,
        "question": "Which of the following factors shifts the hemoglobin-oxygen dissociation curve to the right, promoting oxygen release to tissues?",
        "options": {
          "A": "Decreased temperature",
          "B": "Increased pH (alkalosis)",
          "C": "Increased 2,3-bisphosphoglycerate (2,3-BPG)",
          "D": "Presence of fetal hemoglobin (HbF)"
        },
        "correct": "C",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "Decreased temperature shifts the curve to the left, increasing oxygen affinity and reducing oxygen delivery to tissues. Increased temperature (such as during fever or exercise) causes a right shift."
          },
          "B": {
            "status": "Incorrect",
            "text": "Increased pH (alkalosis) shifts the curve to the left, increasing oxygen affinity. Decreased pH (acidosis) causes a right shift, promoting oxygen release to metabolically active tissues (the Bohr effect)."
          },
          "C": {
            "status": "Correct",
            "text": "Increased 2,3-BPG binds to deoxyhemoglobin and stabilizes the T-state, reducing hemoglobin's oxygen affinity and promoting oxygen release to tissues. This is an important adaptive mechanism at high altitude, where increased 2,3-BPG production improves oxygen delivery despite lower atmospheric oxygen."
          },
          "D": {
            "status": "Incorrect",
            "text": "Fetal hemoglobin (HbF) shifts the curve to the left because its gamma chains have reduced affinity for 2,3-BPG, causing HbF to hold onto oxygen more tightly. This facilitates oxygen transfer from maternal to fetal blood."
          }
        }
      },
      {
        "number": 8,
        "question": "What is the primary rate-limiting enzyme in the heme biosynthesis pathway?",
        "options": {
          "A": "ALA dehydrase",
          "B": "Ferrochelatase",
          "C": "Delta-ALA synthase",
          "D": "Uroporphyrinogen decarboxylase"
        },
        "correct": "C",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "ALA dehydrase catalyzes the conversion of ALA to porphobilinogen in the cytoplasm. While it is an important enzyme in heme biosynthesis (and is inhibited by lead), it is not the rate-limiting step."
          },
          "B": {
            "status": "Incorrect",
            "text": "Ferrochelatase is the final enzyme in heme biosynthesis, inserting iron into protoporphyrin IX to form heme. It is also inhibited by lead but is not the rate-limiting enzyme."
          },
          "C": {
            "status": "Correct",
            "text": "Delta-ALA synthase catalyzes the first and rate-limiting step of heme biosynthesis, converting glycine and succinyl-CoA to 5-aminolevulinic acid (ALA). It requires pyridoxal phosphate (vitamin B6) as a cofactor and is regulated by EPO and iron availability."
          },
          "D": {
            "status": "Incorrect",
            "text": "Uroporphyrinogen decarboxylase is an intermediate enzyme in heme biosynthesis. Its deficiency causes porphyria cutanea tarda, but it is not the rate-limiting step."
          }
        }
      },
      {
        "number": 9,
        "question": "Which of the following best describes a reticulocyte?",
        "options": {
          "A": "A fully mature erythrocyte that has been in circulation for more than 60 days",
          "B": "An enucleated immature red blood cell that still contains residual RNA",
          "C": "A nucleated erythroid precursor that has not yet begun hemoglobin synthesis",
          "D": "A platelet precursor derived from megakaryocytes"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "A fully mature erythrocyte that has been circulating for over 60 days is simply an aging red blood cell, not a reticulocyte. Reticulocytes are younger than mature erythrocytes and represent recently produced cells."
          },
          "B": {
            "status": "Correct",
            "text": "A reticulocyte is an enucleated immature red blood cell that still contains residual RNA, giving it a slightly bluish tinge on standard staining (polychromasia). The residual RNA is visible with supravital stains such as new methylene blue. Reticulocytes complete the final 20% of hemoglobin synthesis before becoming fully mature erythrocytes."
          },
          "C": {
            "status": "Incorrect",
            "text": "A nucleated erythroid precursor that has not yet begun hemoglobin synthesis more closely describes a pro-erythroblast or basophilic erythroblast. Reticulocytes have already lost their nucleus and have synthesized most of their hemoglobin."
          },
          "D": {
            "status": "Incorrect",
            "text": "Platelet precursors derived from megakaryocytes are proplatelets, not reticulocytes. Reticulocytes are strictly in the erythroid lineage."
          }
        }
      },
      {
        "number": 10,
        "question": "Which of the following best describes the function of thrombopoietin (TPO)?",
        "options": {
          "A": "It stimulates the production of neutrophils from myeloid progenitors",
          "B": "It promotes the production of megakaryocytes and platelets",
          "C": "It drives the differentiation of B-cells and T-cells from lymphoid progenitors",
          "D": "It regulates the destruction of aged red blood cells in the spleen"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "The production of neutrophils from myeloid progenitors is primarily driven by G-CSF and GM-CSF, not thrombopoietin. TPO acts specifically on the megakaryocyte lineage."
          },
          "B": {
            "status": "Correct",
            "text": "Thrombopoietin (TPO) is the primary growth factor for megakaryopoiesis. It acts through the MPL receptor to promote megakaryocyte proliferation, differentiation, and ultimately platelet production. TPO is regulated by a negative feedback loop in which circulating platelets bind and degrade TPO."
          },
          "C": {
            "status": "Incorrect",
            "text": "B-cell and T-cell differentiation from lymphoid progenitors is driven primarily by IL-7, not thrombopoietin. TPO has no significant role in lymphoid development."
          },
          "D": {
            "status": "Incorrect",
            "text": "The destruction of aged red blood cells is performed by splenic macrophages through mechanical filtration and phagocytosis. This process is not regulated by thrombopoietin."
          }
        }
      }
    ],
    "lecture_num": "01",
    "quiz_type": "pre",
    "lecture_title": "Hematopoiesis Part I"
  },
  {
    "title": "Hematopoiesis Part I \u2014 Post-Quiz",
    "subtitle": "1 | Jan 8 | Jason Kurzer",
    "filename": "01-hematopoiesis-i-post.md",
    "questions": [

            "text": "Glanzmann thrombasthenia is a qualitative platelet disorder caused by GP-IIb/IIIa deficiency. It presents with mucocutaneous bleeding but characteristically has a normal platelet count and normal platelet size. It does not cause eczema, immunodeficiency, or thrombocytopenia."
          },
          "C": {
            "status": "Correct",
            "text": "Wiskott-Aldrich syndrome is an X-linked recessive disorder caused by mutations in the WAS gene. It presents with the classic triad of thrombocytopenia with characteristically small platelets (microthrombocytopenia), eczema, and immunodeficiency (recurrent infections). The small platelet size is a distinguishing feature that differentiates it from other congenital thrombocytopenias."
          },
          "D": {
            "status": "Incorrect",
            "text": "Thrombocytopenia with absent radii (TAR) syndrome presents with thrombocytopenia and bilateral absence of the radius bones, a skeletal abnormality not mentioned in this patient. TAR does not cause eczema or immunodeficiency, and the characteristic small platelets described here are specific to Wiskott-Aldrich syndrome."
          }
        }
      },
      {
        "number": 11,
        "question": "A patient with a suspected platelet function disorder undergoes platelet aggregometry. Aggregation is absent in response to ADP, collagen, epinephrine, and thrombin, but aggregation to ristocetin is normal. Which of the following is the most likely diagnosis?",
        "options": {
          "A": "Bernard-Soulier syndrome",
          "B": "Glanzmann thrombasthenia",
          "C": "Von Willebrand disease",
          "D": "Aspirin effect"
        },
        "correct": "B",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "Bernard-Soulier syndrome (GPIb-IX-V deficiency) would show absent ristocetin-induced aggregation because ristocetin works by promoting GPIb-VWF interaction. In this patient, ristocetin aggregation is normal, ruling out Bernard-Soulier. Bernard-Soulier would also present with macrothrombocytopenia."
          },
          "B": {
            "status": "Correct",
            "text": "Glanzmann thrombasthenia is caused by deficiency or dysfunction of GP-IIb/IIIa, the receptor that mediates platelet aggregation by binding fibrinogen to cross-link adjacent platelets. Since all agonist-induced aggregation (ADP, collagen, epinephrine, thrombin) ultimately depends on GP-IIb/IIIa for the final aggregation step, all are absent. Ristocetin-induced agglutination is preserved because it depends on GPIb-VWF interaction, which is independent of GP-IIb/IIIa."
          },
          "C": {
            "status": "Incorrect",
            "text": "Von Willebrand disease would characteristically show decreased or absent ristocetin-induced aggregation (because ristocetin depends on VWF to mediate GPIb binding), but responses to other agonists like ADP and collagen would remain intact. The pattern of absent aggregation to all agonists except ristocetin is the opposite of what VWD would produce."
          },
          "D": {
            "status": "Incorrect",
            "text": "Aspirin irreversibly inhibits cyclooxygenase, blocking thromboxane A2 production. This impairs aggregation responses to weak agonists (ADP, collagen, epinephrine) but does not abolish them completely, and aggregation to strong agonists like thrombin remains intact. The complete absence of aggregation to all agonists including thrombin indicates a structural receptor deficiency, not an aspirin effect."
          }
        }
      },
      {
        "number": 12,
        "question": "A patient has a normal platelet count but absent ristocetin-induced platelet aggregation with normal aggregation to all other agonists. She also has macrothrombocytopenia. Which platelet receptor is most likely defective?",
        "options": {
          "A": "GP-IIb/IIIa",
          "B": "Thromboxane A2 receptor",
          "C": "GPIb-IX-V",
          "D": "Collagen receptor (GPVI)"
        },
        "correct": "C",
        "explanation": "",
        "option_explanations": {
          "A": {
            "status": "Incorrect",
            "text": "GP-IIb/IIIa deficiency (Glanzmann thrombasthenia) would cause absent aggregation to all agonists (ADP, collagen, epinephrine, thrombin) but preserved ristocetin-induced agglutination -- the opposite of this patient's pattern. GP-IIb/IIIa deficiency also does not cause macrothrombocytopenia."
          },
          "B": {
            "status": "Incorrect",
            "text": "Thromboxane A2 receptor deficiency would impair platelet activation responses but would not selectively abolish ristocetin-induced aggregation. Ristocetin agglutination is independent of the TXA2 pathway and depends solely on GPIb-VWF interaction."
          },
          "C": {
            "status": "Correct",
            "text": "Absent ristocetin-induced platelet aggregation with normal responses to all other agonists, combined with macrothrombocytopenia, is the classic pattern of Bernard-Soulier syndrome (GPIb-IX-V deficiency). Ristocetin induces platelet agglutination by promoting VWF binding to GPIb, so a defective GPIb-IX-V complex abolishes this response. The large platelets are a characteristic morphologic feature of Bernard-Soulier."
          },
          "D": {
            "status": "Incorrect",
            "text": "Collagen receptor (GPVI) deficiency would specifically impair collagen-induced platelet activation and aggregation but would not affect ristocetin-induced agglutination (which depends on GPIb-VWF interaction). The selective loss of ristocetin response with macrothrombocytopenia points to GPIb-IX-V deficiency, not GPVI."
          }
        }
      }
    ],
    "lecture_num": "13",
    "quiz_type": "post",
    "lecture_title": "Platelets"
  }
];

let currentQuiz = null;
let answered = {};
let score = 0;
let revealed = {};

function init() {
  const list = document.getElementById('quiz-list');
  let currentLectureNum = null;
  QUIZZES.forEach((q, i) => {
    if (q.lecture_num !== currentLectureNum) {
      currentLectureNum = q.lecture_num;
      if (i > 0) {
        const divider = document.createElement('div');
        divider.className = 'lecture-divider';
        list.appendChild(divider);
      }
      const header = document.createElement('div');
      header.className = 'lecture-header';
      header.textContent = q.lecture_title;
      list.appendChild(header);
    }
    const btn = document.createElement('button');
    btn.className = 'quiz-btn';
    const isPre = q.quiz_type === 'pre';
    const badgeClass = isPre ? 'badge-pre' : 'badge-post';
    const badgeText = isPre ? 'PRE' : 'POST';
    btn.innerHTML = '<span class="badge ' + badgeClass + '">' + badgeText + '</span> ' +
      (isPre ? 'Pre-Quiz' : 'Post-Quiz') +
      '<span class="q-count">' + q.questions.length + ' Qs</span>';
    btn.onclick = () => loadQuiz(i);
    btn.id = 'qbtn-' + i;
    list.appendChild(btn);
  });
}

function loadQuiz(index) {
  currentQuiz = index;
  answered = {};
  revealed = {};
  score = 0;
  const quiz = QUIZZES[index];

  document.querySelectorAll('.quiz-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('qbtn-' + index).classList.add('active');
  document.querySelector('.sidebar').classList.remove('open');

  const isPre = quiz.quiz_type === 'pre';
  const typeBadgeClass = isPre ? 'pre-badge' : 'post-badge';
  const typeBadgeText = isPre ? 'PRE-QUIZ' : 'POST-QUIZ';
  const main = document.getElementById('main');
  let html = '<div class="quiz-header">';
  html += '<div class="quiz-type-badge ' + typeBadgeClass + '">' + typeBadgeText + '</div>';
  html += '<h2>' + escHtml(quiz.lecture_title || quiz.title) + '</h2>';
  html += '<div class="meta">' + escHtml(quiz.subtitle) + '</div></div>';
  html += '<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>';
  html += '<div class="score-bar"><span id="score-text">0 of ' + quiz.questions.length + ' answered</span><span class="score" id="score-val"></span></div>';

  quiz.questions.forEach((q, qi) => {
    html += '<div class="question-card" id="qcard-' + qi + '">';
    html += '<div class="q-number">Question ' + q.number + '</div>';
    html += '<div class="q-text">' + escHtml(q.question) + '</div>';
    html += '<div class="options" id="opts-' + qi + '">';
    ['A','B','C','D'].forEach(letter => {
      if (q.options[letter]) {
        html += '<div class="option-wrapper">';
        html += '<button class="option-btn" id="opt-' + qi + '-' + letter + '" onclick="selectAnswer(' + qi + ',\'' + letter + '\')">';
        html += '<span class="letter">' + letter + '</span>';
        html += '<span>' + escHtml(q.options[letter]) + '</span>';
        html += '</button>';
        // Per-option explanation (hidden initially)
        const optExp = q.option_explanations && q.option_explanations[letter];
        if (optExp) {
          const isCorrectOpt = letter === q.correct;
          html += '<div class="opt-explanation ' + (isCorrectOpt ? 'opt-correct' : 'opt-wrong') + '" id="optexp-' + qi + '-' + letter + '">';
          html += escHtml(optExp.text);
          html += '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div>';
    // Reveal answer button
    html += '<button class="reveal-btn" id="reveal-' + qi + '" onclick="revealAnswer(' + qi + ')">';
    html += '<span class="icon">&#128161;</span> I Don\'t Know &mdash; Show Me the Answer';
    html += '</button>';
    // Fallback general explanation
    html += '<div class="explanation" id="exp-' + qi + '"><div class="exp-label"></div><div class="exp-text"></div></div>';
    html += '</div>';
  });

  html += '<div id="results-area"></div>';
  main.innerHTML = html;
  window.scrollTo(0, 0);
}

function selectAnswer(qi, letter) {
  if (answered[qi] || revealed[qi]) return;

  const quiz = QUIZZES[currentQuiz];
  const q = quiz.questions[qi];
  answered[qi] = letter;
  const isCorrect = letter === q.correct;
  if (isCorrect) score++;

  // Hide reveal button
  document.getElementById('reveal-' + qi).classList.add('hidden');

  // Style options and show per-option explanations
  ['A','B','C','D'].forEach(l => {
    const btn = document.getElementById('opt-' + qi + '-' + l);
    if (!btn) return;
    btn.classList.add('disabled');
    if (l === q.correct) btn.classList.add('correct');
    if (l === letter && !isCorrect) btn.classList.add('wrong');
    if (l === letter) btn.classList.add('selected');

    // Show per-option explanation
    const optExp = document.getElementById('optexp-' + qi + '-' + l);
    if (optExp) optExp.classList.add('show');
  });

  // Style card
  const card = document.getElementById('qcard-' + qi);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Show general explanation if no per-option explanations exist
  const hasOptExp = q.option_explanations && Object.keys(q.option_explanations).length > 0;
  if (!hasOptExp && q.explanation) {
    const exp = document.getElementById('exp-' + qi);
    exp.classList.add('show', isCorrect ? 'correct-exp' : 'wrong-exp');
    exp.querySelector('.exp-label').textContent = isCorrect ? 'Correct!' : 'Incorrect - Answer: ' + q.correct;
    exp.querySelector('.exp-text').textContent = q.explanation;
  }

  updateProgress(quiz);
}

function revealAnswer(qi) {
  if (answered[qi] || revealed[qi]) return;

  const quiz = QUIZZES[currentQuiz];
  const q = quiz.questions[qi];
  revealed[qi] = true;

  // Hide reveal button
  document.getElementById('reveal-' + qi).classList.add('hidden');

  // Style options
  ['A','B','C','D'].forEach(l => {
    const btn = document.getElementById('opt-' + qi + '-' + l);
    if (!btn) return;
    btn.classList.add('disabled');
    if (l === q.correct) btn.classList.add('correct');

    // Show per-option explanation
    const optExp = document.getElementById('optexp-' + qi + '-' + l);
    if (optExp) optExp.classList.add('show');
  });

  // Style card
  const card = document.getElementById('qcard-' + qi);
  card.classList.add('answered-reveal');

  // Show general explanation if no per-option explanations
  const hasOptExp = q.option_explanations && Object.keys(q.option_explanations).length > 0;
  if (!hasOptExp && q.explanation) {
    const exp = document.getElementById('exp-' + qi);
    exp.classList.add('show', 'reveal-exp');
    exp.querySelector('.exp-label').textContent = 'Answer: ' + q.correct;
    exp.querySelector('.exp-text').textContent = q.explanation;
  }

  updateProgress(quiz);
}

function updateProgress(quiz) {
  const total = quiz.questions.length;
  const answeredCount = Object.keys(answered).length;
  const revealedCount = Object.keys(revealed).length;
  const totalDone = answeredCount + revealedCount;
  document.getElementById('progress').style.width = (totalDone / total * 100) + '%';
  document.getElementById('score-text').textContent = totalDone + ' of ' + total + ' answered';
  const scoreText = score + '/' + answeredCount + ' correct';
  const revealText = revealedCount > 0 ? ' (' + revealedCount + ' revealed)' : '';
  document.getElementById('score-val').textContent = answeredCount > 0 ? scoreText + revealText : revealedCount > 0 ? revealedCount + ' revealed' : '';
  if (totalDone === total) showResults();
}

function showResults() {
  const quiz = QUIZZES[currentQuiz];
  const total = quiz.questions.length;
  const answeredCount = Object.keys(answered).length;
  const revealedCount = Object.keys(revealed).length;
  const pct = answeredCount > 0 ? Math.round(score / answeredCount * 100) : 0;
  let grade = 'needs-work';
  if (pct >= 80) grade = 'great';
  else if (pct >= 60) grade = 'ok';

  const area = document.getElementById('results-area');
  area.innerHTML = '<div class="results">' +
    '<h3>Quiz Complete!</h3>' +
    '<div class="pct ' + grade + '">' + pct + '%</div>' +
    '<div class="detail">' + score + ' correct out of ' + answeredCount + ' attempted</div>' +
    (revealedCount > 0 ? '<div class="detail-sub">' + revealedCount + ' question' + (revealedCount > 1 ? 's' : '') + ' revealed (not scored)</div>' : '') +
    '<div class="action-row">' +
    '<button class="btn btn-primary" onclick="loadQuiz(' + currentQuiz + ')">Retry Quiz</button>' +
    '<button class="btn btn-outline" onclick="reviewMissed()">Review Missed</button>' +
    '</div></div>';
}

function reviewMissed() {
  const quiz = QUIZZES[currentQuiz];
  let firstMissed = null;
  quiz.questions.forEach((q, qi) => {
    const card = document.getElementById('qcard-' + qi);
    if (answered[qi] === q.correct) {
      card.style.display = 'none';
    } else {
      card.style.display = 'block';
      if (!firstMissed) firstMissed = card;
    }
  });
  if (firstMissed) firstMissed.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('results-area').innerHTML = '';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
